<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Office Line">
<meta name="theme-color" content="#000000">
<title>Office Line</title>
<style>html,body{margin:0;height:100%;background:#000;font:15px -apple-system,system-ui,sans-serif;color:#8a8a8e;display:grid;place-items:center}</style>
</head>
<body>
<p id="msg">Loading…</p>
<script>
/* Loader: always pulls the newest app straight from GitHub, so updates show up without re-installing. */
(async () => {
  const repo = "edencohen103-oss/office-line", t = Date.now();
  const sources = [
    () => fetch(`https://api.github.com/repos/${repo}/contents/app.html?ref=main&t=${t}`, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" }),
    () => fetch(`https://raw.githubusercontent.com/${repo}/main/app.html?t=${t}`, { cache: "no-store" }),
  ];
  for (const get of sources) {
    try {
      const r = await get();
      if (!r.ok) continue;
      const html = await r.text();
      if (!html.includes("Office Line")) continue;
      try { localStorage.setItem("ol_app_cache", html); } catch(e){}
      document.open(); document.write(html); document.close(); return;
    } catch(e) {}
  }
  let cached = null; try { cached = localStorage.getItem("ol_app_cache"); } catch(e){}
  if (cached) { document.open(); document.write(cached); document.close(); return; }
  document.getElementById("msg").textContent = "No connection. Check your internet and reopen.";
})();
</script>
</body>
</html>
