<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Office Line">
<meta name="theme-color" content="#000000">
<title>Office Line</title>
<style>
/* Home looks like an iOS Settings page: grouped list, chevrons, one Start button. */
:root{
  --bg:#000; --cell:#1c1c1e; --sep:#38383a; --fg:#fff; --muted:#8d8d93; --tint:#ff3b30; --check:#ff3b30;
  --sarah:#34c759; --dave:#ff9f0a; --client:#0a84ff;
  --ui:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100dvh;margin:0;overscroll-behavior:none;background:var(--bg);color:var(--fg);font-family:var(--ui)}
body{overflow-x:hidden;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}
[hidden]{display:none!important}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}

/* ---------- Home / pages ---------- */
.page{background:var(--bg);overflow-y:auto}
.topbar{height:44px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;flex:none}
.topbar h1{margin:0;text-align:center;font-size:17px;font-weight:600}
.round{width:34px;height:34px;border-radius:50%;background:rgba(120,120,128,.32);display:grid;place-items:center}
.round svg{width:18px;height:18px;fill:#fff}
.logo{display:grid;place-items:center}
.logo span{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center}
.logo svg{width:18px;height:18px;fill:#fff}

.group{background:var(--cell);border-radius:12px;overflow:hidden;margin-top:18px}
.group-title{font-size:13px;color:var(--muted);text-transform:uppercase;margin:24px 16px -10px;letter-spacing:.02em}
.group-note{font-size:13px;color:var(--muted);margin:8px 16px 0;line-height:1.4}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;text-align:left;position:relative;font-size:17px}
.row + .row::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.group.plain .row + .row::before{left:16px}
.row .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.row .ic svg{width:17px;height:17px;fill:#fff}
.row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.row .chev{width:8px;height:13px;flex:none;fill:none;stroke:#5a5a5f;stroke-width:2}
.row .tick{width:16px;height:16px;fill:none;stroke:var(--check);stroke-width:2.6;flex:none}
.row input{flex:1;min-width:0;border:0;background:none;font:17px var(--ui);text-align:right;color:var(--muted);outline:none}
.row .sub2{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.row.tall{min-height:58px;padding-block:8px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.av.sarah{background:var(--sarah)} .av.dave{background:var(--dave)} .av.client{background:var(--client)} .av.maria{background:#bf5af2} .av.tony{background:#a2845e}

.start{margin-top:22px;width:100%;height:50px;border-radius:12px;background:var(--cell);font-size:17px;font-weight:600;color:#fff}
.start:active{background:#2c2c2e}
.danger{color:var(--tint)}
.err{color:var(--tint);font-size:14px;text-align:center;margin-top:12px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:14px 8px 0;line-height:1.4}
.ver{font-size:12px;color:#aeaeb2;text-align:center;margin-top:18px}

/* Answer mode preview cards */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.mode{border-radius:14px;padding:6px;background:var(--cell);border:2px solid transparent}
.mode[aria-pressed="true"]{border-color:var(--tint)}
.mode .mini{aspect-ratio:9/16;border-radius:10px;background:linear-gradient(180deg,#3a3a3e,#1b1b1e);color:#fff;display:flex;flex-direction:column;align-items:center;padding:16px 8px 12px}
.mode .mini small{font-size:9px;color:#aaa}
.mode .mini b{font-size:17px;font-weight:600}
.mode .mini .bt{margin-top:auto;display:flex;justify-content:space-around;width:100%}
.mode .mini .bt i{width:22px;height:22px;border-radius:50%;display:block}
.mode .mini .sl{margin-top:auto;width:90%;height:24px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;padding:2px}
.mode .mini .sl i{width:20px;height:20px;border-radius:50%;background:#fff;display:block}
.mode p{margin:6px 0 2px;font-size:14px;text-align:center}

/* Armed: pure black, tiny hint at the bottom */
#armed{background:#000;justify-content:flex-end;align-items:center}
#armed p{color:#3a3a3c;font-size:11px;text-align:center;max-width:300px;line-height:1.4;margin:0 0 6px}

/* Slide to answer */
.slide-wrap{margin-top:auto;width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;gap:44px;padding-bottom:max(5vh,28px)}
.slide-wrap .pair{display:grid;grid-template-columns:1fr 1fr;width:100%}
.track{position:relative;width:100%;height:76px;border-radius:38px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);overflow:hidden;touch-action:none}
.track .txt{position:absolute;inset:0;display:grid;place-items:center;padding-left:60px;font-size:21px;color:transparent;
  background:linear-gradient(90deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.35) 40%,#fff 50%,rgba(255,255,255,.35) 60%,rgba(255,255,255,.35) 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
.knob{position:absolute;left:6px;top:6px;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;will-change:transform}
.knob svg{width:30px;height:30px;fill:#34c759}

/* Phone-style home screen shown after a call (double-tap to return to the app) */
#spring{background:radial-gradient(120% 80% at 20% 10%,#5b6cff 0%,transparent 55%),radial-gradient(120% 90% at 90% 90%,#ff7a59 0%,transparent 55%),linear-gradient(160deg,#2b2f77,#7a3b6f 60%,#c2554a);
  color:#fff;padding:calc(env(safe-area-inset-top,0px) + 6px) 22px calc(env(safe-area-inset-bottom,0px) + 10px);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
#spring .sb{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;height:30px;padding:0 8px}
#spring .sb .r{display:flex;gap:6px;align-items:center}
#spring .sb svg{height:12px;fill:#fff}
#spring .apps{margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;justify-items:center}
#spring .app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
#spring .ico{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
#spring .ico svg{width:32px;height:32px;fill:#fff}
#spring .ico.cal{background:#fff;color:#111;flex-direction:column;gap:0;line-height:1}
#spring .ico.cal small{font-size:9px;font-weight:600;color:#e5484d;text-transform:uppercase}
#spring .ico.cal b{font-size:28px;font-weight:300}
#spring .dots{margin-top:auto;display:flex;justify-content:center;gap:8px;padding-bottom:14px}
#spring .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
#spring .dots i:first-child{background:#fff}
#spring.photo{background-size:cover;background-position:center}
#spring.photo > *{visibility:hidden}
#spring .dock{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;padding:14px 10px;border-radius:30px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
</style>
<style>
/* Call — native iOS call screen look */
#call{background:#222224;background:linear-gradient(180deg,#3a3a3e 0%,#26262a 45%,#1b1b1e 100%);align-items:center;text-align:center;
  font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,sans-serif;color:#fff}
.who{margin-top:max(8vh,56px);display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.sub{font-size:19px;font-weight:600;color:#9d9da2;letter-spacing:.01em}
.name{font-size:clamp(30px,9vw,38px);font-weight:600;letter-spacing:-.01em;text-wrap:balance;padding-inline:8px;line-height:1.15}
.live .sub{order:2;font-size:18px;font-weight:400;color:#c7c7cc}
.timer{font-variant-numeric:tabular-nums}

.ring-wrap{margin-top:auto;width:100%;max-width:330px;display:grid;grid-template-columns:1fr 1fr;row-gap:40px;padding-bottom:max(4vh,24px)}
.act{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:17px;font-weight:500;color:#fff}
.small .circle{width:46px;height:46px;background:#3a3a3c;border:1px solid #4a4a4e}
.small svg{width:22px;height:22px;fill:#fff}
.big .circle{width:76px;height:76px}
.big svg{width:34px;height:34px;fill:#fff}
.circle{border-radius:50%;display:grid;place-items:center}
.decline .circle{background:#b8312a}
.accept .circle{background:#4a8c45}

.grid{margin-top:auto;width:100%;max-width:310px;display:grid;grid-template-columns:repeat(3,1fr);row-gap:22px;justify-items:center}
.key{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:14px;font-weight:500;color:#fff}
.key .circle{width:76px;height:76px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.key.end .circle{background:#eb4545}
.key svg{width:30px;height:30px;fill:#fff}
.key[aria-pressed="true"] .circle{background:#fff}
.key[aria-pressed="true"] svg{fill:#1c1c1e}
.endrow{height:max(7vh,44px)}
.endrow .circle{width:72px;height:72px;background:#eb4545}
.endrow svg{width:32px;height:32px;fill:#fff}

</style>
</head>
<body>

<!-- HOME -->
<section id="setup" class="screen page">
  <div class="topbar">
    <button class="round" id="moreBtn" aria-label="More settings"><svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></button>
    <div class="logo"><span><svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg></span></div>
    <span></span>
  </div>

  <div class="group">
    <button class="row tall" data-page="who"><span class="av" id="whoAv">S</span><span class="lbl"><span id="whoName">Sarah</span><span class="sub2" id="whoDesc"></span></span><svg class="chev" viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>
    <button class="row" data-page="approval" id="approvalRow" hidden><span class="lbl">Approved terms</span><span class="val" id="approvalVal"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>
  </div>

  <div class="group">
    <button class="row" data-page="time"><span class="ic" style="background:#ff3b30"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.4l3.5 2.1-.8 1.3L11 13V7h2v5.4z"/></svg></span><span class="lbl">Time</span><span class="val" id="timeVal"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>
    <button class="row" data-page="contact"><span class="ic" style="background:#ff3b30"><svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2c-3 0-9 1.5-9 4.5V21h18v-2.5c0-3-6-4.5-9-4.5z"/></svg></span><span class="lbl">Contact</span><span class="val" id="contactVal"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>
    <button class="row" data-page="ringtone"><span class="ic" style="background:#ff3b30"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 00-3 0v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></span><span class="lbl">Ringtone</span><span class="val" id="ringVal"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>
    <button class="row" data-page="answer"><span class="ic" style="background:#ff3b30"><svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm0 3v13h10V5H7z"/></svg></span><span class="lbl">Answer mode</span><span class="val" id="answerVal"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>
    <button class="row" data-page="homescreen"><span class="ic" style="background:#ff3b30"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg></span><span class="lbl">Home screen</span><span class="val" id="homeVal"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>
    <button class="row" data-page="story"><span class="ic" style="background:#ff3b30"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 00-9 9H1l4 4 4-4H6a7 7 0 112.05 4.95l-1.42 1.42A9 9 0 1013 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12z"/></svg></span><span class="lbl">The day</span><span class="val" id="storyVal"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>
  </div>

  <button class="start" id="armBtn">Start</button>
  <div class="err" id="err" hidden></div>
  <p class="hint" id="a2hs" hidden>For a full-screen call: Share → Add to Home Screen, then open it from there.</p>
  <div class="ver">Office Line v12</div>
</section>

<!-- PUSHED PAGE (Time, Contact, Ringtone…) -->
<section id="sub" class="screen page" hidden>
  <div class="topbar">
    <button class="round" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15.4 4.6L8 12l7.4 7.4-1.4 1.4L5.2 12 14 3.2z"/></svg></button>
    <h1 id="subTitle"></h1>
    <span></span>
  </div>
  <div id="subBody"></div>
</section>

<!-- PHONE HOME SCREEN (after a call; double-tap to return to the app) -->
<section id="spring" class="screen" hidden>
  <div class="sb"><span id="sbTime">12:00</span><span class="r"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>5G<svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="2"/><rect x="24" y="4" width="2" height="4" rx="1" opacity=".5"/></svg></span></div>
  <div class="apps"><div class="app"><span class="ico cal"><small id="sbDay">Thu</small><b id="sbDate">15</b></span>Calendar</div><div class="app"><span class="ico" style="background:linear-gradient(135deg,#f6a04d,#e2557a)"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm1 13h14l-4.5-6-3.5 4.5-2.5-3L5 17z"/></svg></span>Photos</div><div class="app"><span class="ico" style="background:linear-gradient(135deg,#8e9aaf,#4b5566)"><svg viewBox="0 0 24 24"><path d="M9 4l-1.8 2H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-3.2L15 4H9zm3 4.5a4.5 4.5 0 110 9 4.5 4.5 0 010-9z"/></svg></span>Camera</div><div class="app"><span class="ico" style="background:linear-gradient(135deg,#4aa3ff,#2563eb)"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v.5l7 4.5 7-4.5V7H5zm14 2.8l-7 4.5-7-4.5V17h14V9.8z"/></svg></span>Mail</div><div class="app"><span class="ico" style="background:linear-gradient(135deg,#ffd76a,#f5b301)"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2zm2 5v2h10V8H7zm0 4v2h10v-2H7zm0 4v2h6v-2H7z"/></svg></span>Notes</div><div class="app"><span class="ico" style="background:#1c1c1e"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.4l3.5 2.1-.8 1.3L11 13V7h2v5.4z"/></svg></span>Clock</div><div class="app"><span class="ico" style="background:linear-gradient(135deg,#6cc4ff,#2f7de1)"><svg viewBox="0 0 24 24"><path d="M19 18H7a5 5 0 01-.6-10 6 6 0 0111.4 2A4 4 0 0119 18z"/></svg></span>Weather</div><div class="app"><span class="ico" style="background:linear-gradient(135deg,#7bd88f,#2f9e5a)"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 00-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg></span>Maps</div><div class="app"><span class="ico" style="background:#3a3a3c"><svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm1 3v4h10V5H7zm0 7v2h2v-2H7zm function caseBlock(n){
  if (!caseFile.length) return "";
  let txt = caseFile.map((c,i)=>`--- Call ${i+1}: ${c.speaker} with ${n} (${c.title}) ---\n` + c.lines.join("\n")).join("\n\n");

  return `

${txt}`;
}


function audio(){ if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }

/* Incoming-call ringtone: an original marimba phrase, loud and bright like a phone ringer */
function marimba(a, out, freq, t, vel){
  const g = a.createGain(); g.connect(out);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  [[1, 1], [4, 0.28], [10, 0.06]].forEach(([mult, amp]) => {
    const o = a.createOscillator(), og = a.createGain();
    o.type = "sine"; o.frequency.value = freq * mult; og.gain.value = amp;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.6);
  });
}
/* Short "line connects" click+chirp when you answer */
function connectBlip(){
  const a = audio(), t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.08);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.14);
}

function startAmbience(){
  const a = audio(); const out = a.createGain(); out.gain.value = 0.0; out.connect(a.destination);
  out.gain.linearRampToValueAtTime(0.18, a.currentTime + 1.5);
  // room tone: filtered noise
  const len = a.sampleRate * 2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random()*2-1)) / 1.02; d[i] = last * 3.5; }
  const n = a.createBufferSource(); n.buffer = buf; n.loop = true;
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
  n.connect(lp); lp.connect(out); n.start();
  let alive = true;
  // keyboard clicks
  const clickBuf = a.createBuffer(1, 600, a.sampleRate), cd = clickBuf.getChannelData(0);
  for (let i = 0; i < 600; i++) cd[i] = (Math.random()*2-1) * Math.exp(-i/60);
  const typeRun = () => {
    if (!alive) return;
    const count = 4 + Math.floor(Math.random()*14); let t = a.currentTime;
    for (let i = 0; i < count; i++) {
      t += 0.07 + Math.random()*0.12;
      const s = a.createBufferSource(), g = a.createGain(), hp = a.createBiquadFilter();
      hp.type = "bandpass"; hp.frequency.value = 2200 + Math.random()*1800;
      g.gain.value = 0.25 + Math.random()*0.25;
      s.buffer = clickBuf; s.connect(hp); hp.connect(g); g.connect(out); s.start(t);
    }
    setTimeout(typeRun, 1500 + Math.random()*5000);
  };
  // distant phone ring
  const farPhone = () => {
    if (!alive) return;
    const t = a.currentTime;
    for (let r = 0; r < 2; r++) {
      const s = t + r * 3;
      const o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
      o.frequency.value = 1300; o2.frequency.value = 1550; f.type = "lowpass"; f.frequency.value = 1800;
      o.connect(g); o2.connect(g); g.connect(f); f.connect(out);
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.025, s+0.03); g.gain.setValueAtTime(0.025, s+1); g.gain.linearRampToValueAtTime(0, s+1.05);
      o.start(s); o2.start(s); o.stop(s+1.1); o2.stop(s+1.1);
    }
    setTimeout(farPhone, 20000 + Math.random()*25000);
  };
  setTimeout(typeRun, 800); setTimeout(farPhone, 9000 + Math.random()*8000);
  return () => { alive = false; try { n.stop(); } catch(e){} out.disconnect(); };
}



/* ---------- More ringtones (original patterns, not any phone maker's tune) ---------- */
function bellTone(a, out, t, dur){
  const g = a.createGain(); g.connect(out); g.gain.value = 0;
  const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 22; lg.gain.value = 0.18;
  lfo.connect(lg); lg.connect(g.gain);
  [[880, 0.5], [1180, 0.35], [2350, 0.08]].forEach(([f, amp]) => {
    const o = a.createOscillator(), og = a.createGain(); o.frequency.value = f; og.gain.value = amp;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + dur);
  });
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.2, t + 0.02);
  g.gain.setValueAtTime(0.2, t + dur - 0.05); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  lfo.start(t); lfo.stop(t + dur);
}
function startRing(kind = ringKind){
  if (kind === "none") return () => {};
  const a = audio(); const out = a.createGain(); out.gain.value = 0.9;
  const comp = a.createDynamicsCompressor(); out.connect(comp); comp.connect(a.destination);
  let alive = true, to = null;
  const N = { G5:784, A5:880, B5:988, C6:1047, D6:1175, E6:1319, F6:1397, G6:1568 };
  const patterns = {
    marimba: { gap: 2100, notes: [["G5",0],["D6",0.16],["B5",0.32],["E6",0.48],["D6",0.64],["G6",0.80],["G5",1.04],["D6",1.20],["B5",1.36],["A5",1.52]] },
    chimes:  { gap: 2600, notes: [["E6",0],["C6",0.3],["D6",0.6],["G5",0.9],["G5",1.5],["D6",1.8],["E6",2.1],["C6",2.4]] },
  };
  const play = () => {
    if (!alive) return;
    const t = a.currentTime + 0.03;
    if (kind === "classic") { bellTone(a, out, t, 1.0); bellTone(a, out, t + 1.4, 1.0); to = setTimeout(play, 4200); return; }
    const p = patterns[kind] || patterns.marimba;
    p.notes.forEach(([n, d], i) => marimba(a, out, N[n], t + d, i % 2 ? 0.35 : 0.5));
    to = setTimeout(play, p.gap + (kind === "chimes" ? 600 : 0));
  };
  play();
  return () => { alive = false; clearTimeout(to); try { out.disconnect(); } catch(e){} };
}

/* ---------- Run: Start → black screen → ring ---------- */
let wakeLock = null;
async function keepAwake(){ try { wakeLock = await navigator.wakeLock?.request("screen"); } catch(e){} }

async function prepare(){
  $("err").hidden = true;
  try {
    audio().resume();
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
  } catch(e) {
    $("err").textContent = "Microphone is blocked. Allow the microphone for this page in Settings, then try again.";
    $("err").hidden = false; return false;
  }
  try { if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch(e){}
  try { if (navigator.audioSession) navigator.audioSession.type = "play-and-record"; } catch(e){}
  await keepAwake();
  return true;
}

$("armBtn").onclick = async () => {
  if (pick === "approved" && !approvalReady()) { PAGES.approval(); return; }
  if (!(await prepare())) return;
  if (dayStep <= 0) { caseFile = []; store.set("ol_case7", []); }
  if (dayStep === 0) store.set("ol_prev_call", null);
  show("armed");
  $("armedTxt").textContent = `The phone will be called in ${inWords(delay)}. Don't lock the screen and don't return to the home screen.`;
  const at = $("armedTxt"); at.style.transition = "none"; at.style.opacity = "1";
  clearTimeout(window.__armedHide); window.__armedHide = setTimeout(() => { at.style.transition = "opacity .4s"; at.style.opacity = "0"; }, 2000);
  clearTimeout(timer);
  timer = setTimeout(() => incoming(pick), delay * 1000);
};

// Tap the black screen 3 times to cancel
$("armed").onclick = () => {
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 900);
  if (taps >= 3) { taps = 0; reset(); }
};

function incoming(id){
  sel = BY_ID[id];
  $("callerName").textContent = callerFor(sel.who);
  $("callSub").textContent = "mobile";
  $("who").classList.remove("live");
  const slide = answerMode === "slide";
  $("ringActions").hidden = slide; $("slideActions").hidden = !slide; $("liveActions").hidden = true;
  resetKnob();
  show("call");
  ring = startRing(ringKind);
}

$("declineBtn").onclick = () => { ring && ring(); ring = null; afterCall(); };

/* Slide to answer */
const knob = $("knob"), track = $("track");
function resetKnob(){ knob.style.transition = "none"; knob.style.transform = ""; track.querySelector(".txt").style.opacity = 1; }
(() => {
  let x0 = null, max = 0, dx = 0;
  knob.addEventListener("pointerdown", (e) => { x0 = e.clientX; max = track.clientWidth - knob.offsetWidth - 12; knob.setPointerCapture(e.pointerId); knob.style.transition = "none"; });
  knob.addEventListener("pointermove", (e) => {
    if (x0 == null) return;
    dx = Math.max(0, Math.min(max, e.clientX - x0));
    knob.style.transform = `translateX(${dx}px)`;
    track.querySelector(".txt").style.opacity = String(1 - dx / max);
  });
  const up = () => {
    if (x0 == null) return; x0 = null;
    if (dx >= max * 0.85) { knob.style.transform = `translateX(${max}px)`; $("acceptBtn").onclick(); }
    else { knob.style.transition = "transform .25s ease"; knob.style.transform = ""; track.querySelector(".txt").style.opacity = 1; }
    dx = 0;
  };
  knob.addEventListener("pointerup", up); knob.addEventListener("pointercancel", up);
})();

$("acceptBtn").onclick = async () => {
  ring && ring(); ring = null; connectBlip();
  $("ringActions").hidden = true; $("slideActions").hidden = true; $("liveActions").hidden = false;
  $("who").classList.add("live");
  inCall = true; $("speakerBtn").setAttribute("aria-pressed","true");
  // Real calls start counting the moment you answer
  callStart = Date.now();
  const paint = () => {
    const t = Math.floor((Date.now() - callStart) / 1000);
    $("callSub").innerHTML = `<span class="timer">${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}</span>`;
  };
  paint(); clearInterval(tick); tick = setInterval(paint, 500);
  const n = name();
  const dayHistory = (dayStep > 0 && sel.who !== "client" && DAY[dayStep] === sel.id) ? caseBlock(n) : "";
  const prev = store.get("ol_prev_call", null);
  const redial = prev && prev.id === sel.id && Date.now() - prev.at < 45 * 60e3 && prev.lines && prev.lines.length;
  const history = redial
    ? dayHistory + `

# This is a CALLBACK. You just spoke with ${n} about this a few minutes ago and the call ended. Here is that call:
${prev.lines.join("\n")}

Continue EXACTLY from where that call left off. Do NOT repeat your opening news or anything you already said in it. If you had already started compromising or agreed on next steps, keep moving forward from there. Open with a short line that fits ("okay, so where were we", "I checked one more thing"), then carry on.`
    : dayHistory;
  const REDIAL = { sarah:`${n}, it's Sarah. Calling you back.`, dave:`${n}, Dave again. Okay, where were we?`, client:`Hi ${n}, it's Mark again, sorry, we got cut off.`, maria:`Hey ${n}, it's Maria, I think we got cut off.`, tony:`Hey, Tony again, lost you there.` };
  const first = redial ? REDIAL[sel.who] : sel.first(n);
  current = { speaker: SPEAKER[sel.who], title: SHORT[sel.id].t, lines: [] };
  try {
    conv = await Conversation.startSession({
      agentId: AGENTS[sel.who],
      connectionType: "websocket",
      dynamicVariables: { rep_name: n, first_line: first, brief: sel.brief ? sel.brief(n) : (BRIEF_EXTRA[sel.id] || ""), history: history || " " },
      onMessage: (m) => {
        const text = (m && (m.message ?? m.text)) || "";
        if (!text || !current) return;
        const who = (m.source === "user" || m.role === "user") ? n : SPEAKER[sel.who].split(" ")[0];
        current.lines.push(`${who}: ${text}`);
      },
      onModeChange: onMode,
      onConnect: () => {
        setSpeaker($("speakerBtn").getAttribute("aria-pressed") === "true");
        // Office ambience disabled: the mic picked it up and the agent "heard" it as speech
      },
      onDisconnect: () => endCall(false),
      onError: (m) => { console.error(m); }
    });
  } catch(e) {
    console.error(e);
    current = null;
    $("callSub").textContent = "Call failed";
    setTimeout(afterCall, 1500);
  }
};


/* ---------- Ear detection ----------
   Phone at your ear → screen black, speaker off (quiet, like the earpiece).
   Lower the phone → screen back, speaker on again. The mic is never muted automatically. */
let inCall = false, earSince = 0, awaySince = 0, earSeen = false, manualMute = false, speakerOn = true, agentTalking = false, unmuteTimer = null;
function setEar(on){ $("ear").hidden = !on; }
function applyMic(){
  // On speaker, the mic is closed while she talks so she doesn't hear her own voice (echo).
  const closed = manualMute || (speakerOn && agentTalking);
  try { conv?.setMicMuted?.(closed); } catch(e){}
}
function setMute(on){ manualMute = on; $("muteBtn").setAttribute("aria-pressed", on); applyMic(); }
function onMode(m){
  const talking = (m && (m.mode || m)) === "speaking";
  clearTimeout(unmuteTimer);
  if (talking) { agentTalking = true; applyMic(); }
  else unmuteTimer = setTimeout(() => { agentTalking = false; applyMic(); }, 350);
}
addEventListener("deviceorientation", (e) => {
  if (!inCall || e.beta == null) return;
  const b = Math.abs(e.beta), g = Math.abs(e.gamma || 0);
  const atEar = b > 45 && b < 135 && g > 28;
  const now = Date.now();
  if (atEar) {
    awaySince = 0;
    if (!earSince) earSince = now;
    if (now - earSince > 350 && !earSeen) { setEar(true); earSeen = true; setSpeaker(false); }
  } else {
    earSince = 0;
    if (!awaySince) awaySince = now;
    if (earSeen && now - awaySince > 500) { setEar(false); earSeen = false; setSpeaker(true); }
  }
});
// Backup: double-tap the name to black out manually; tap the black screen to wake it.
let lastTap = 0;
$("who").addEventListener("click", () => { if (!inCall) return; const t = Date.now(); if (t - lastTap < 350) setEar(true); lastTap = t; });
$("ear").addEventListener("click", () => { setEar(false); earSince = Date.now() + 1500; });

$("muteBtn").onclick = () => setMute($("muteBtn").getAttribute("aria-pressed") !== "true");
/* Speaker: lit = loud (speakerphone). Off = quiet, like holding it to your ear. */
function setSpeaker(on){
  speakerOn = on;
  $("speakerBtn").setAttribute("aria-pressed", on);
  try { conv?.setVolume?.({ volume: on ? 1 : 0.22 }); } catch(e){}
  applyMic();
}
$("speakerBtn").onclick = () => setSpeaker($("speakerBtn").getAttribute("aria-pressed") !== "true");

$("endBtn").onclick = () => endCall(true);

/* Save what was said so the next call continues from it */
function storeCurrent(manual){
  const c = current; current = null;
  if (c && c.lines.length && sel) {
    const prev = store.get("ol_prev_call", null);
    // A redial of the same scenario keeps growing the same thread
    const lines = (prev && prev.id === sel.id && Date.now() - prev.at < 45 * 60e3) ? prev.lines.concat(["(call ended, then called back)"], c.lines) : c.lines;
    store.set("ol_prev_call", { id: sel.id, at: Date.now(), lines: lines.slice(-60) });
  }
  if (!c || !c.lines.length || dayStep < 0 || DAY[dayStep] !== sel?.id) return;
  c.lines.push(manual ? `(${name()} hung up here)` : "(call ended here)");
  caseFile.push(c); caseFile = caseFile.slice(-6); store.set("ol_case7", caseFile); store.set("ol_case_at", Date.now());
}

let ending = false;
async function endCall(manual){
  if (ending || (!current && !conv)) return;
  ending = true;
  clearInterval(tick); tick = null;
  ambience && ambience(); ambience = null;
  const c = conv; conv = null;
  if (manual && c) { try { await c.endSession(); } catch(e){} }
  storeCurrent(manual);
  $("callSub").textContent = "Call Ended";
  setTimeout(() => { ending = false; afterCall(); }, 1100);
}


/* ---------- After a call: back to Home, already set to the logical next caller ---------- */
function afterCall(){
  inCall = false; setEar(false); earSeen = false; manualMute = false; agentTalking = false; speakerOn = true; earSince = 0; awaySince = 0;
  if (sel) {
    lastId = sel.id; store.set("ol_last", lastId);
    if (dayStep >= 0 && DAY[dayStep] === sel.id) {
      dayStep = dayStep + 1 < DAY.length ? dayStep + 1 : 0;
      pick = DAY[dayStep]; store.set("ol_pick", pick); store.set("ol_day7", dayStep);
    }
  }
  $("muteBtn").setAttribute("aria-pressed", "false");
  reset(); showSpring();
}


/* ---------- Phone home screen after a call ---------- */
let springTick = null, springTap = 0;
function paintSpring(){
  const d = new Date();
  $("sbTime").textContent = d.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }).replace(/\s?[AP]M/i, "");
  $("sbDay").textContent = d.toLocaleDateString("en-US", { weekday:"short" });
  $("sbDate").textContent = d.getDate();
}
function showSpring(){ $("spring").classList.toggle("photo", !!homeImg); $("spring").style.backgroundImage = homeImg ? `url(${homeImg})` : ""; paintSpring(); clearInterval(springTick); springTick = setInterval(paintSpring, 10000); show("spring"); }
$("spring").addEventListener("click", () => {
  const t = Date.now();
  if (t - springTap < 400) { springTap = 0; clearInterval(springTick); renderHome(); show("setup"); }
  else springTap = t;
});

function reset(){
  clearTimeout(timer); ring && ring(); ring = null;
  try { wakeLock?.release(); } catch(e){} wakeLock = null;
  renderHome();
  show("setup");
}

renderHome();
show("setup");
if (!(navigator.standalone || matchMedia("(display-mode: standalone)").matches)) $("a2hs").hidden = false;

</script>
